[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syncvr"
version = "0.1.0"
description = "Synchronized video playback and fleet control for standalone VR headsets"
requires-python = ">=3.8"
dependencies = ["aiohttp>=3.8"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
syncvr = "syncvr.__main__:main"

[tool.setuptools]
packages = ["syncvr", "syncvr.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
