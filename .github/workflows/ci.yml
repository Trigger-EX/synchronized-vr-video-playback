name: CI

on:
  push:
    branches-ignore: ["apk/**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0
      - run: pip install -e ".[test,gui]" pyflakes
      - run: python -m pyflakes syncvr tests
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  player-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the APK to apk/<branch>
    defaults:
      run:
        working-directory: player-android
    env:
      SYNCVR_KEYSTORE_BASE64: ${{ secrets.SYNCVR_KEYSTORE_BASE64 }}
      SYNCVR_KEYSTORE_PASSWORD: ${{ secrets.SYNCVR_KEYSTORE_PASSWORD }}
      SYNCVR_KEY_ALIAS: ${{ secrets.SYNCVR_KEY_ALIAS }}
      SYNCVR_KEY_PASSWORD: ${{ secrets.SYNCVR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The end-to-end test (core/.../e2e) starts the Python server, so it needs python + aiohttp.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install aiohttp
        working-directory: .
      - name: Unit and end-to-end tests
        env:
          SYNCVR_E2E_REQUIRED: "1" # fail, not skip, if the server cannot start
        run: ./gradlew --no-daemon :core:test
      - name: Check signing secrets
        run: |
          missing=""
          for name in SYNCVR_KEYSTORE_BASE64 SYNCVR_KEYSTORE_PASSWORD SYNCVR_KEY_ALIAS SYNCVR_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Add these repository secrets under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - name: Fetch VrApi SDK
        run: ./tools/fetch-vrapi.sh
      - name: Build signed APKs
        run: |
          export SYNCVR_KEYSTORE_FILE="$RUNNER_TEMP/syncvr.jks"
          printf '%s' "$SYNCVR_KEYSTORE_BASE64" | base64 -d > "$SYNCVR_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:assembleRelease :operator:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SyncVRPlayer.apk
          cp operator/build/outputs/apk/release/operator-release.apk SyncVROperator.apk
          rm -f "$SYNCVR_KEYSTORE_FILE"
      - name: Verify APK signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs SyncVRPlayer.apk
          "$apksigner" verify --print-certs SyncVROperator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SyncVRPlayer-apk
          path: player-android/SyncVRPlayer.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SyncVROperator-apk
          path: player-android/SyncVROperator.apk
          if-no-files-found: error
      # Force-pushes a one-commit branch apk/<branch> holding the APKs, so it can be fetched with
      # git (player-android/tools/get-apk.sh). Skipped if the branch moved on during this run.
      - name: Publish APK to apk/<branch>
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          head=$(git ls-remote "$remote" "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Branch moved on to $head; not publishing this older build."
            exit 0
          fi
          out="$RUNNER_TEMP/apk-publish"
          mkdir -p "$out"
          cp SyncVRPlayer.apk SyncVROperator.apk "$out/"
          cd "$out"
          {
            echo "branch: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > BUILD.txt
          git init -q
          git add SyncVRPlayer.apk SyncVROperator.apk BUILD.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "SyncVRPlayer.apk and SyncVROperator.apk from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push -q -f "$remote" "HEAD:refs/heads/apk/${GITHUB_REF_NAME}"

  # Self-contained desktop app (PyInstaller onedir), built natively on each OS and published as an
  # asset of the rolling prerelease desktop-<branch> (fetched with tools/get-desktop.sh|.ps1).
  desktop:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: server
    permissions:
      contents: write # creates/updates the desktop-<branch> release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: SyncVR-linux-x86_64.tar.gz
          - os: windows-latest
            asset: SyncVR-windows-x86_64.zip
          - os: macos-14
            asset: SyncVR-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1
      - run: pip install "./server[gui]" pyinstaller
      - run: pyinstaller --noconfirm packaging/syncvr.spec
      - name: Smoke test the built app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then exe=dist/SyncVR.app/Contents/MacOS/SyncVR
          elif [ "$RUNNER_OS" = Windows ]; then exe=dist/SyncVR/SyncVR.exe
          else exe=dist/SyncVR/SyncVR; fi
          "$exe" --self-test
      - name: Archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            tar -czf "${{ matrix.asset }}" -C dist SyncVR
          elif [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/SyncVR -DestinationPath '${{ matrix.asset }}'"
          else
            codesign --force --deep -s - dist/SyncVR.app
            ditto -c -k --keepParent dist/SyncVR.app "${{ matrix.asset }}"
          fi
          ls -l "${{ matrix.asset }}"
      - name: Publish to release desktop-<branch>
        shell: bash
        run: |
          tag="desktop-${GITHUB_REF_NAME//\//-}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Desktop app ($GITHUB_REF_NAME)" \
              --notes "Rolling desktop builds of ${GITHUB_REF_NAME}. Fetch with tools/get-desktop.sh or tools/get-desktop.ps1." \
              || gh release view "$tag" >/dev/null  # another matrix job may have created it first
          fi
          gh release upload "$tag" "${{ matrix.asset }}" --clobber
          gh release edit "$tag" --notes "Rolling desktop builds of ${GITHUB_REF_NAME}; latest commit ${GITHUB_SHA::7}."
