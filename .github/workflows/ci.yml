name: CI

on:
  push:
    branches-ignore: ["apk/**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[test]" pyflakes
      - run: python -m pyflakes syncvr tests
      - run: python -m pytest -q

  player-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the APK to apk/<branch>
    defaults:
      run:
        working-directory: player-android
    env:
      SYNCVR_KEYSTORE_BASE64: ${{ secrets.SYNCVR_KEYSTORE_BASE64 }}
      SYNCVR_KEYSTORE_PASSWORD: ${{ secrets.SYNCVR_KEYSTORE_PASSWORD }}
      SYNCVR_KEY_ALIAS: ${{ secrets.SYNCVR_KEY_ALIAS }}
      SYNCVR_KEY_PASSWORD: ${{ secrets.SYNCVR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The end-to-end test (core/.../e2e) starts the Python server, so it needs python + aiohttp.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install aiohttp
        working-directory: .
      - name: Unit and end-to-end tests
        env:
          SYNCVR_E2E_REQUIRED: "1" # fail, not skip, if the server cannot start
        run: ./gradlew --no-daemon :core:test
      - name: Check signing secrets
        run: |
          missing=""
          for name in SYNCVR_KEYSTORE_BASE64 SYNCVR_KEYSTORE_PASSWORD SYNCVR_KEY_ALIAS SYNCVR_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Add these repository secrets under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - name: Fetch VrApi SDK
        run: ./tools/fetch-vrapi.sh
      - name: Build signed APK
        run: |
          export SYNCVR_KEYSTORE_FILE="$RUNNER_TEMP/syncvr.jks"
          printf '%s' "$SYNCVR_KEYSTORE_BASE64" | base64 -d > "$SYNCVR_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SyncVRPlayer.apk
          rm -f "$SYNCVR_KEYSTORE_FILE"
      - name: Verify APK signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs SyncVRPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SyncVRPlayer-apk
          path: player-android/SyncVRPlayer.apk
          if-no-files-found: error
      # Force-pushes a one-commit branch apk/<branch> holding the APK, so it can be fetched with
      # git (player-android/tools/get-apk.sh). Skipped if the branch moved on during this run.
      - name: Publish APK to apk/<branch>
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          head=$(git ls-remote "$remote" "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Branch moved on to $head; not publishing this older build."
            exit 0
          fi
          out="$RUNNER_TEMP/apk-publish"
          mkdir -p "$out"
          cp SyncVRPlayer.apk "$out/"
          cd "$out"
          {
            echo "branch: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > BUILD.txt
          git init -q
          git add SyncVRPlayer.apk BUILD.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "SyncVRPlayer.apk from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push -q -f "$remote" "HEAD:refs/heads/apk/${GITHUB_REF_NAME}"
